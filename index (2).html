<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Segitiga Exposure</title>
    <style>
        :root {
            --bg-color: #1e1e24;
            --panel-color: #2b2b36;
            --text-color: #f5f5f5;
            --accent-color: #4facfe;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--panel-color);
            width: 100%;
            max-width: 800px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* --- VIEWFINDER (Pemandangan) --- */
        .viewfinder-container {
            position: relative;
            width: 100%;
            height: 350px;
            background-color: #000;
            overflow: hidden;
        }

        .scene {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            position: relative;
            transition: filter 0.2s ease-out;
            /* Filter ini akan diubah oleh JavaScript */
            filter: brightness(1); 
        }

        .sun {
            position: absolute;
            top: 40px;
            right: 60px;
            width: 60px;
            height: 60px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 40px #FFD700;
        }

        .mountain-1, .mountain-2 {
            position: absolute;
            bottom: 60px;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 200px solid #2c3e50;
        }

        .mountain-1 { left: -50px; }
        .mountain-2 { right: 50px; border-bottom-color: #34495e; border-bottom-width: 250px; }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #27ae60;
        }

        /* --- EXPOSURE METER --- */
        .exposure-meter {
            background: #1a1a1a;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .meter-scale {
            position: relative;
            width: 80%;
            height: 10px;
            background: linear-gradient(90deg, #e74c3c 0%, #f1c40f 25%, #2ecc71 50%, #f1c40f 75%, #e74c3c 100%);
            border-radius: 5px;
            margin: 15px 0;
        }

        .meter-ticks {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            top: -20px;
            font-size: 12px;
            color: #ccc;
        }

        .meter-needle {
            position: absolute;
            top: -5px;
            left: 50%; /* 50% adalah exposure 0 / tepat */
            width: 4px;
            height: 20px;
            background: white;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: left 0.3s ease-out;
            transform: translateX(-50%);
        }

        .meter-status {
            font-size: 14px;
            font-weight: bold;
            color: #2ecc71;
        }

        /* --- CONTROLS --- */
        .controls {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #ccc;
        }

        .control-value {
            font-weight: bold;
            color: var(--accent-color);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #555;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Simulasi Segitiga Exposure</h2>
            <p style="font-size: 14px; color: #aaa; margin-top: 5px;">Atur slider untuk melihat efeknya pada cahaya gambar.</p>
        </div>

        <!-- Viewfinder Kamera -->
        <div class="viewfinder-container">
            <div class="scene" id="scene">
                <div class="sun"></div>
                <div class="mountain-2"></div>
                <div class="mountain-1"></div>
                <div class="ground"></div>
            </div>
        </div>

        <!-- Light Meter / Exposure Meter -->
        <div class="exposure-meter">
            <div class="meter-scale">
                <div class="meter-ticks">
                    <span>-3</span>
                    <span>-2</span>
                    <span>-1</span>
                    <span>0</span>
                    <span>+1</span>
                    <span>+2</span>
                    <span>+3</span>
                </div>
                <div class="meter-needle" id="meterNeedle"></div>
            </div>
            <div class="meter-status" id="meterStatus">Correct Exposure</div>
        </div>

        <!-- Kontrol Segitiga Exposure -->
        <div class="controls">
            <!-- Aperture -->
            <div class="control-group">
                <div class="control-header">
                    <span>Aperture (Bukaan)</span>
                    <span class="control-value" id="apertureVal">f/5.6</span>
                </div>
                <input type="range" id="apertureSlider" min="0" max="8" step="1" value="4">
            </div>

            <!-- Shutter Speed -->
            <div class="control-group">
                <div class="control-header">
                    <span>Shutter Speed (Rana)</span>
                    <span class="control-value" id="shutterVal">1/125s</span>
                </div>
                <input type="range" id="shutterSlider" min="0" max="12" step="1" value="7">
            </div>

            <!-- ISO -->
            <div class="control-group">
                <div class="control-header">
                    <span>ISO (Sensitivitas)</span>
                    <span class="control-value" id="isoVal">400</span>
                </div>
                <input type="range" id="isoSlider" min="0" max="6" step="1" value="2">
            </div>
        </div>
    </div>

    <script>
        // Array nilai dari terang ke gelap (Aperture & Shutter) atau gelap ke terang (ISO)
        const apertures = ["f/1.4", "f/2", "f/2.8", "f/4", "f/5.6", "f/8", "f/11", "f/16", "f/22"]; // Index tinggi = makin gelap
        const shutters = ["1s", "1/2s", "1/4s", "1/8s", "1/15s", "1/30s", "1/60s", "1/125s", "1/250s", "1/500s", "1/1000s", "1/2000s", "1/4000s"]; // Index tinggi = makin gelap
        const isos = ["100", "200", "400", "800", "1600", "3200", "6400"]; // Index tinggi = makin terang

        // Referensi elemen DOM
        const apertureSlider = document.getElementById('apertureSlider');
        const shutterSlider = document.getElementById('shutterSlider');
        const isoSlider = document.getElementById('isoSlider');
        
        const apertureVal = document.getElementById('apertureVal');
        const shutterVal = document.getElementById('shutterVal');
        const isoVal = document.getElementById('isoVal');
        
        const scene = document.getElementById('scene');
        const meterNeedle = document.getElementById('meterNeedle');
        const meterStatus = document.getElementById('meterStatus');

        // Nilai target eksposur (kombinasi nilai indeks agar exposure pas di titik 0)
        // Contoh awal: Aperture index 4 (f/5.6), Shutter 7 (1/125), ISO 2 (400)
        // Total Base Kegelapan = 4 + 7 - 2 = 9. 
        const TARGET_EXPOSURE_INDEX = 9;

        function updateExposure() {
            const apIdx = parseInt(apertureSlider.value);
            const shIdx = parseInt(shutterSlider.value);
            const isoIdx = parseInt(isoSlider.value);

            // Update Text Label
            apertureVal.textContent = apertures[apIdx];
            shutterVal.textContent = shutters[shIdx];
            isoVal.textContent = isos[isoIdx];

            // Kalkulasi Exposure
            // Nilai total saat ini = (Index Aperture) + (Index Shutter) - (Index ISO)
            const currentExposureIndex = apIdx + shIdx - isoIdx;
            
            // Selisih eksposur (dalam satuan Stop Cahaya)
            // Positif = Overexposed (terlalu banyak cahaya)
            // Negatif = Underexposed (kurang cahaya)
            let exposureDiff = TARGET_EXPOSURE_INDEX - currentExposureIndex;

            // --- Update Meter Visual ---
            // Kita batasi jarum di antara -3.5 dan +3.5 stop agar tidak keluar kotak
            let displayDiff = Math.max(-3.5, Math.min(3.5, exposureDiff));
            
            // Konversi ke persentase kiri-kanan (0% paling kiri, 50% tengah, 100% kanan)
            // Range total di UI adalah -3 hingga +3 (rentang 6)
            let leftPercentage = 50 + (displayDiff * (100 / 6)); 
            meterNeedle.style.left = `${leftPercentage}%`;

            // Update Status Teks
            if (exposureDiff < -0.5) {
                meterStatus.textContent = "Underexposed (Terlalu Gelap)";
                meterStatus.style.color = "#e74c3c";
            } else if (exposureDiff > 0.5) {
                meterStatus.textContent = "Overexposed (Terlalu Terang)";
                meterStatus.style.color = "#e74c3c";
            } else {
                meterStatus.textContent = "Correct Exposure (Cahaya Pas)";
                meterStatus.style.color = "#2ecc71";
            }

            // --- Update Gambar Viewfinder ---
            // Menghitung filter kecerahan (brightness). 
            // Setiap 1 stop perbedaan menggandakan / membagi dua cahaya.
            // Rumus base: 2 pangkat (exposureDiff)
            // Digunakan pengali 0.6 agar perubahannya lebih dramatis namun tetap terlihat di browser.
            let brightnessLevel = Math.pow(2, exposureDiff * 0.6);
            scene.style.filter = `brightness(${brightnessLevel})`;
        }

        // Tambahkan Event Listener ke semua slider
        apertureSlider.addEventListener('input', updateExposure);
        shutterSlider.addEventListener('input', updateExposure);
        isoSlider.addEventListener('input', updateExposure);

        // Jalankan sekali saat halaman dimuat
        updateExposure();
    </script>
</body>
</html>
